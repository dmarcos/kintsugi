<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kintsugi Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #efe6d8;
    --muted: rgba(239, 230, 216, 0.6);
    --line: rgba(239, 230, 216, 0.16);
    --gold: #d9b25c;
    --bg: #0d0c0b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .brand { position: fixed; top: 28px; left: 32px; display: flex; align-items: baseline; gap: 14px; pointer-events: none; }
  .brand .kanji { font-family: 'Shippori Mincho', serif; font-size: 20px; color: var(--gold); letter-spacing: 0.12em; }
  .brand .word { font-family: 'Cormorant Garamond', serif; font-size: 26px; letter-spacing: 0.08em; }
  .brand .sub { font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }

  .counter { position: fixed; top: 32px; right: 32px; font-size: 12px; letter-spacing: 0.22em; color: var(--muted);
    font-variant-numeric: tabular-nums; text-align: right; }
  .counter b { color: var(--ink); font-weight: 500; }
  .status { margin-top: 8px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold);
    opacity: 0; transition: opacity 0.4s; }
  .status.on { opacity: 0.9; }

  .hint { position: fixed; left: 50%; top: 34px; transform: translateX(-50%); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--muted); pointer-events: none; white-space: nowrap; }

  .info { position: fixed; left: 32px; bottom: 32px; max-width: 390px; transition: opacity 0.35s ease, transform 0.35s ease; }
  .info.out { opacity: 0; transform: translateY(10px); }
  .tag { display: inline-block; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .tag[hidden] { display: none; }
  .tag.ref { color: var(--gold); border-color: rgba(217, 178, 92, 0.45); }
  .info h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 46px; line-height: 1.04; margin: 14px 0 6px; }
  .info .jp { font-family: 'Shippori Mincho', serif; color: var(--gold); font-size: 15px; letter-spacing: 0.2em; }
  .info .meta { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); margin: 16px 0 8px; text-transform: uppercase; }
  .info .desc { font-size: 14px; line-height: 1.6; color: rgba(239, 230, 216, 0.82); margin: 0; font-weight: 300; }
  .info .how { display: inline-block; margin-top: 18px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(217, 178, 92, 0.4); padding-bottom: 3px; }
  .info .how:hover { border-color: var(--gold); }

  .nav { position: fixed; right: 32px; bottom: 32px; display: flex; align-items: center; gap: 18px; }
  .arrow { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20, 18, 16, 0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--ink); cursor: pointer; display: grid; place-items: center;
    transition: border-color 0.25s, color 0.25s, opacity 0.25s; padding: 0; }
  .arrow:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .arrow:disabled { opacity: 0.28; cursor: default; }
  .arrow svg { width: 18px; height: 18px; }
  .dots { display: flex; gap: 8px; }
  .dots button { width: 24px; height: 18px; border: 0; padding: 0; background: none; cursor: pointer; position: relative; }
  .dots button::after { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--line);
    transition: background 0.3s; }
  .dots button.on::after { background: var(--gold); }
  .dots button:hover::after { background: rgba(217, 178, 92, 0.6); }

  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity 0.9s ease;
    z-index: 10; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .box { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #loader svg { width: 120px; height: 120px; }
  #loader .crack { stroke: var(--gold); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-dasharray: 200;
    stroke-dashoffset: 200; animation: draw 2.4s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 200; } 55%, 100% { stroke-dashoffset: 0; } }
  #loader p { margin: 0; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }

  body.recording .brand, body.recording .hint, body.recording .counter, body.recording .info, body.recording .nav { display: none; }
  body.recording canvas { inset: auto; }
  #recBadge { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5; display: none; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 999px; background: rgba(20, 18, 16, 0.75); border: 1px solid var(--line);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  #recBadge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #e0483e; }
  body.recording #recBadge, #recBadge.on { display: flex; }

  @media (max-width: 760px) {
    .brand { top: 18px; left: 16px; gap: 10px; }
    .brand .sub, .hint { display: none; }
    .counter { top: 22px; right: 16px; }
    .info { left: 16px; right: 16px; bottom: 96px; max-width: none; }
    .info h1 { font-size: 32px; margin-top: 10px; }
    .info .meta { margin-top: 10px; }
    .info .desc { font-size: 13px; }
    .nav { left: 16px; right: 16px; bottom: 24px; justify-content: space-between; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<header class="brand">
  <span class="kanji">金継ぎ</span><span class="word">Kintsugi</span><span class="sub">Collection viewer</span>
</header>
<div class="hint">Drag to orbit · Scroll to zoom · ← → to browse · R to record</div>
<div class="counter">
  <div><b id="idx">01</b> / <span id="total">05</span></div>
  <div class="status" id="status">Firing glaze</div>
</div>

<section class="info" id="info">
  <span class="tag" id="tag"></span>
  <h1 id="name"></h1>
  <div class="jp" id="jp"></div>
  <p class="meta" id="meta"></p>
  <p class="desc" id="desc"></p>
  <a class="how" id="how" href="explanation.html">How it's made →</a>
</section>

<nav class="nav">
  <button class="arrow" id="prev" aria-label="Previous piece">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="dots" id="dots"></div>
  <button class="arrow" id="next" aria-label="Next piece">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>

<div id="recBadge"></div>

<div id="loader">
  <div class="box">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(239,230,216,.18)" stroke-width="1.2"/>
      <path class="crack" d="M72 8 C70 30 66 46 61 58 S44 84 18 96"/>
    </svg>
    <p id="loadText">Mixing urushi &amp; gold</p>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

import { TAU, D2R, clamp, mix, smoothstep, nextFrame, buildBead, bakeMaps, PIECES } from './core.js';
import { setAnisotropy, makeBackdrop, studioEnvironment, contactTex, makeGoldMaterial, potteryMaterial, mountOnStand } from './studio.js';

// ---- renderer, scene, camera ------------------------------------------------

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
setAnisotropy(renderer);

const scene = new THREE.Scene();
scene.background = makeBackdrop();
scene.environment = studioEnvironment(renderer);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);

const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {
  enableDamping: true, dampingFactor: 0.07, enablePan: false, rotateSpeed: 0.6, zoomSpeed: 0.8,
  minDistance: 1.4, maxDistance: 10, minPolarAngle: 0.15, maxPolarAngle: 1.53,
});

const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.45, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());


// ---- lights & floor ---------------------------------------------------------------

const sun = new THREE.DirectionalLight(0xfff0dc, 1.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5, near: 0.5, far: 20 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// Soft fill from behind so the backs of pieces don't fall into black.
const backFill = new THREE.DirectionalLight(0xfff4e8, 1.4);
scene.add(backFill, backFill.target);
scene.add(new THREE.HemisphereLight(0xfff6ee, 0x2a2420, 0.5));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.ShadowMaterial({ opacity: 0.38 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);


// ---- materials ----------------------------------------------------------------------

const goldMaterial = makeGoldMaterial();

const firingMaterial = new THREE.MeshPhysicalMaterial({ color: 0x2a2622, roughness: 0.55, clearcoat: 0.3, clearcoatRoughness: 0.3 });


// ---- build the carousel -----------------------------------------------------------

const SPACING = 3.9;
const box = new THREE.Box3(), tmp = new THREE.Vector3();

const pieces = PIECES.map((def, i) => {
  const p = Object.assign({}, def, def.build());
  p.index = i;
  p.root = new THREE.Group();
  p.spin = new THREE.Group();
  p.holder = new THREE.Group();
  p.root.position.x = i * SPACING;
  p.root.add(p.spin);
  p.spin.add(p.holder);
  scene.add(p.root);

  p.mesh = new THREE.Mesh(p.surf.geometry(p.segT || 256, p.tex.uv), firingMaterial);
  p.mesh.castShadow = p.mesh.receiveShadow = true;
  p.mesh.userData.index = i;
  p.goldMesh = new THREE.Mesh(buildBead(p.surf, p.cracks, { ...p.gold, ao: p.ao }), goldMaterial);
  p.goldMesh.castShadow = true;
  p.holder.add(p.mesh, p.goldMesh);

  if (p.mount === 'stand') mountOnStand(p);
  else p.holder.scale.setScalar(p.scale || 1);

  p.root.updateMatrixWorld(true);
  box.setFromObject(p.holder);
  p.focusY = (box.min.y + box.max.y) / 2;
  const size = box.getSize(tmp);
  const decal = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false, color: 0x000000 }));
  decal.rotation.x = -Math.PI / 2;
  decal.position.set((box.min.x + box.max.x) / 2 - p.root.position.x, 0.002, (box.min.z + box.max.z) / 2);
  decal.scale.set(size.x * 1.25, Math.max(size.z, 0.5) * 1.25, 1);
  p.spin.add(decal);

  p.ready = false;
  return p;
});


// ---- texture baking queue (nearest piece first) -------------------------------------

let current = 0;
let rec = null;   // active video capture, see the CCapture section at the end
const statusEl = document.getElementById('status');
const loader = document.getElementById('loader');

(async function bakeAll() {
  const queue = [...pieces];
  while (queue.length) {
    queue.sort((a, b) => Math.abs(a.index - current) - Math.abs(b.index - current));
    const p = queue.shift();
    const maps = await bakeMaps(p, { onProgress: (f) => { p.progress = f; updateStatus(); } });
    p.mesh.material = potteryMaterial(p, maps);
    p.ready = true;
    p.pop = 0;
    updateStatus();
    if (!loader.classList.contains('done') && pieces[current].ready) loader.classList.add('done');
  }
})();

function updateStatus() {
  const p = pieces[current];
  statusEl.classList.toggle('on', !p.ready);
  if (!p.ready) statusEl.textContent = `Firing glaze ${Math.round((p.progress || 0) * 100)}%`;
  if (!loader.classList.contains('done')) {
    document.getElementById('loadText').textContent = `Mixing urushi & gold · ${Math.round((p.progress || 0) * 100)}%`;
  }
}

// ---- UI ------------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const dotsEl = $('dots');
$('total').textContent = String(pieces.length).padStart(2, '0');
pieces.forEach((p, i) => {
  const b = document.createElement('button');
  b.setAttribute('aria-label', p.name);
  b.addEventListener('click', () => go(i));
  dotsEl.appendChild(b);
});

function renderInfo() {
  const p = pieces[current];
  $('idx').textContent = String(current + 1).padStart(2, '0');
  $('tag').textContent = p.tag || '';
  $('tag').hidden = !p.tag;
  $('tag').classList.toggle('ref', p.tag === 'Reference');
  $('name').textContent = p.name;
  $('jp').textContent = p.jp;
  $('meta').textContent = p.meta;
  $('desc').textContent = p.desc;
  $('how').href = `explanation.html?piece=${current}`;
  [...dotsEl.children].forEach((b, i) => b.classList.toggle('on', i === current));
  $('prev').disabled = current === 0;
  $('next').disabled = current === pieces.length - 1;
  updateStatus();
}

let infoTimer;
function go(i) {
  i = clamp(i, 0, pieces.length - 1);
  if (i === current) return;
  current = i;
  const info = $('info');
  info.classList.add('out');
  clearTimeout(infoTimer);
  infoTimer = setTimeout(() => { renderInfo(); info.classList.remove('out'); }, 260);
  [...dotsEl.children].forEach((b, k) => b.classList.toggle('on', k === current));
  $('prev').disabled = current === 0;
  $('next').disabled = current === pieces.length - 1;
  startViewTween(pieces[i].view);
}

$('prev').addEventListener('click', () => go(current - 1));
$('next').addEventListener('click', () => go(current + 1));
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(current + 1);
  if (e.key === 'ArrowLeft') go(current - 1);
});

// Horizontal trackpad swipe browses; vertical scroll stays zoom.
let swipeAcc = 0, swipeLock = 0;
canvas.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  const now = performance.now();
  if (now < swipeLock) return;
  swipeAcc += e.deltaX;
  if (Math.abs(swipeAcc) > 60) { go(current + Math.sign(swipeAcc)); swipeAcc = 0; swipeLock = now + 700; }
}, { passive: true });

// Click a neighbouring piece to bring it forward.
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = pieces.map((p) => p.mesh);
let downAt = null;
const pick = (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.index : -1;
};
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const i = pick(e);
  if (i >= 0 && i !== current) go(i);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.buttons) return;
  const i = pick(e);
  canvas.style.cursor = i >= 0 && i !== current ? 'pointer' : 'grab';
});

// ---- camera choreography ---------------------------------------------------------

const focus = new THREE.Vector3(0, pieces[0].focusY, 0);
controls.target.copy(focus);
camera.position.copy(focus).add(new THREE.Vector3().setFromSphericalCoords(pieces[0].view.r, pieces[0].view.phi, 0));

let viewTween = null, lastInteract = -10;
const sph = new THREE.Spherical();
function startViewTween(view) {
  sph.setFromVector3(tmp.subVectors(camera.position, controls.target));
  let theta = sph.theta;
  while (theta > Math.PI) theta -= TAU;
  while (theta < -Math.PI) theta += TAU;
  viewTween = { t: 0, from: { r: sph.radius, phi: sph.phi, theta }, to: { r: view.r, phi: view.phi, theta: 0 } };
}
controls.addEventListener('start', () => { viewTween = null; lastInteract = clock.elapsedTime; });
controls.addEventListener('end', () => { lastInteract = clock.elapsedTime; });

function resize() {
  if (rec) { fitRecordingCanvas(); return; }
  const w = innerWidth, h = innerHeight, aspect = w / h;
  camera.aspect = aspect;
  camera.fov = clamp((2 * Math.atan(Math.tan(26 * D2R) / aspect)) / D2R, 28, 62);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setPixelRatio(DPR);
  composer.setSize(w, h);
}
addEventListener('resize', resize);
resize();
renderInfo();

// ---- loop -------------------------------------------------------------------------------

const clock = new THREE.Clock();
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

renderer.setAnimationLoop(() => {
  const realDt = Math.min(clock.getDelta(), 0.05);
  const dt = rec ? 1 / rec.fps : realDt, time = clock.elapsedTime;
  if (rec) recordingStep();

  // Glide the focus along the row; the camera rides along, keeping its orbit.
  const k = 1 - Math.exp(-dt * 4.2);
  const target = pieces[current];
  const nx = mix(focus.x, current * SPACING, k), ny = mix(focus.y, target.focusY, k);
  tmp.set(nx - focus.x, ny - focus.y, 0);
  focus.set(nx, ny, 0);
  controls.target.add(tmp);
  camera.position.add(tmp);

  if (viewTween) {
    viewTween.t = Math.min(1, viewTween.t + dt / 1.3);
    const e = ease(viewTween.t), f = viewTween.from, to = viewTween.to;
    sph.set(mix(f.r, to.r, e), mix(f.phi, to.phi, e), mix(f.theta, to.theta, e));
    camera.position.copy(controls.target).add(tmp.setFromSpherical(sph));
    if (viewTween.t >= 1) viewTween = null;
  }
  controls.update();

  const idle = time - lastInteract > 3.5;
  for (const p of pieces) {
    const d = Math.abs(focus.x - p.index * SPACING) / SPACING;
    const near = 1 - clamp(d);
    const active = p.index === current;
    if (p.motion === 'sway') {
      if (!active || idle) p.swayT = (p.swayT || 0) + dt;
      p.spin.rotation.y = 0.42 * Math.sin((p.swayT || 0) * 0.32);
    } else if (!active || idle) {
      p.spin.rotation.y += dt * 0.16;
    }
    let s = 0.84 + 0.16 * near;
    if (p.pop !== undefined && p.pop < 1) { p.pop = Math.min(1, p.pop + dt * 1.6); s *= 0.94 + 0.06 * ease(p.pop); }
    p.root.scale.setScalar(s);
  }

  sun.position.set(focus.x - 2.6, 6.2, 3.8);
  sun.target.position.set(focus.x, 0.4, 0);
  backFill.position.set(focus.x + 2.5, 4, -5);
  backFill.target.position.set(focus.x, 0.6, 0);

  composer.render(dt);
  if (rec) recordingCapture();
});

// ---- social video capture (CCapture.js) ----------------------------------------------
// Press R (or open with ?record) to film a scripted tour of the carousel. CCapture takes over
// the clock, so every frame is rendered at a fixed timestep regardless of how slow it is.
// Options: ?record&size=1080x1920&fps=60&hold=3.2&format=webm   (format: webm | png | jpg)

const recParams = new URLSearchParams(location.search);
const recBadge = $('recBadge');

function loadCCapture() {
  if (window.CCapture) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/ccapture.js@1.1.0/build/CCapture.all.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load CCapture.js'));
    document.head.appendChild(s);
  });
}

function fitRecordingCanvas() {
  const k = Math.min(innerWidth / rec.W, (innerHeight - 64) / rec.H, 1);
  Object.assign(canvas.style, {
    width: `${rec.W * k}px`, height: `${rec.H * k}px`,
    left: `${(innerWidth - rec.W * k) / 2}px`, top: `${(innerHeight - rec.H * k) / 2 + 24}px`,
  });
}

function jumpTo(i) {
  current = i;
  renderInfo();
  focus.set(i * SPACING, pieces[i].focusY, 0);
  controls.target.copy(focus);
  camera.position.copy(focus).add(tmp.setFromSphericalCoords(pieces[i].view.r, pieces[i].view.phi, 0));
  viewTween = null;
}

async function startRecording() {
  if (rec) return;
  const [W, H] = (recParams.get('size') || '1080x1920').split('x').map(Number);
  const fps = Number(recParams.get('fps') || 60);
  const hold = Number(recParams.get('hold') || 3.2);
  const format = recParams.get('format') || 'webm';
  recBadge.classList.add('on');
  recBadge.textContent = 'Preparing recording';
  try { await loadCCapture(); } catch (e) { recBadge.textContent = e.message; return; }
  while (!pieces.every((p) => p.ready)) {
    recBadge.textContent = 'Waiting for glazes';
    await nextFrame();
  }
  await document.fonts.ready;

  const overlay = document.createElement('canvas');
  overlay.width = W; overlay.height = H;
  rec = {
    W, H, fps, hold, frame: 0,
    total: Math.round(hold * pieces.length * fps),
    overlay, ctx: overlay.getContext('2d'),
    capturer: new CCapture({ format, framerate: fps, quality: 95, name: `kintsugi-${W}x${H}-${fps}fps` }),
  };
  document.body.classList.add('recording');
  controls.enabled = false;
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  composer.setPixelRatio(1);
  composer.setSize(W, H);
  camera.aspect = W / H;
  camera.fov = W < H ? 50 : 30;   // portrait: frame the widest bowls edge to edge
  camera.updateProjectionMatrix();
  fitRecordingCanvas();
  jumpTo(0);
  rec.capturer.start();
}

function recordingStep() {
  const i = Math.min(Math.floor(rec.frame / rec.fps / rec.hold), pieces.length - 1);
  if (i !== current) go(i);
}

// Composite the render with a caption so the clip stands on its own in a feed.
function drawCaption(ctx, W, H, t) {
  const u = Math.min(W, H) / 1080, pad = 72 * u;
  const i = Math.min(Math.floor(t / rec.hold), pieces.length - 1), p = pieces[i], local = t - i * rec.hold;
  const last = i === pieces.length - 1;
  const alpha = smoothstep(0.55, 1.0, local) * (last ? 1 : 1 - smoothstep(rec.hold - 0.45, rec.hold - 0.1, local));

  const g = ctx.createLinearGradient(0, H * 0.62, 0, H);
  g.addColorStop(0, 'rgba(8,7,6,0)');
  g.addColorStop(1, 'rgba(8,7,6,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = `${4 * u}px`;
  ctx.fillStyle = '#d9b25c';
  ctx.font = `500 ${34 * u}px "Shippori Mincho", serif`;
  ctx.fillText('金継ぎ', pad, pad + 34 * u);
  const kw = ctx.measureText('金継ぎ').width;
  ctx.fillStyle = '#efe6d8';
  ctx.font = `400 ${42 * u}px "Cormorant Garamond", serif`;
  ctx.fillText('Kintsugi', pad + kw + 18 * u, pad + 34 * u);
  ctx.textAlign = 'right';
  ctx.font = `400 ${24 * u}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(239,230,216,0.65)';
  ctx.fillText(`${String(i + 1).padStart(2, '0')} / ${String(pieces.length).padStart(2, '0')}`, W - pad, pad + 30 * u);
  ctx.textAlign = 'left';

  ctx.globalAlpha = alpha;
  const rise = (1 - alpha) * 14 * u;
  let y = H - pad - 10 * u + rise;
  ctx.font = `400 ${24 * u}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(239,230,216,0.68)';
  ctx.letterSpacing = `${3 * u}px`;
  ctx.fillText(p.meta.toUpperCase(), pad, y);
  y -= 50 * u;
  ctx.fillStyle = '#d9b25c';
  ctx.font = `500 ${34 * u}px "Shippori Mincho", serif`;
  ctx.letterSpacing = `${7 * u}px`;
  ctx.fillText(p.jp, pad, y);
  y -= 58 * u;
  ctx.fillStyle = '#efe6d8';
  ctx.font = `500 ${96 * u}px "Cormorant Garamond", serif`;
  ctx.letterSpacing = '0px';
  ctx.fillText(p.name, pad, y);
  ctx.globalAlpha = 1;
  ctx.letterSpacing = '0px';
}

function recordingCapture() {
  const { ctx, W, H } = rec;
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  drawCaption(ctx, W, H, rec.frame / rec.fps);
  rec.capturer.capture(rec.overlay);
  rec.frame++;
  recBadge.textContent = `Recording ${rec.frame} / ${rec.total}`;
  if (rec.frame >= rec.total) finishRecording();
}

function finishRecording() {
  const { capturer } = rec;
  capturer.stop();
  recBadge.textContent = 'Encoding — the file will download';
  capturer.save();
  rec = null;
  document.body.classList.remove('recording');
  canvas.removeAttribute('style');
  controls.enabled = true;
  renderer.setPixelRatio(DPR);
  resize();
  setTimeout(() => recBadge.classList.remove('on'), 4000);
}

addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') startRecording(); });
if (recParams.has('record')) startRecording();
else if (recParams.has('piece')) jumpTo(clamp(Number(recParams.get('piece')) || 0, 0, pieces.length - 1));
</script>
</body>
</html>
