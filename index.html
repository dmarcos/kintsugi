<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kintsugi Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #efe6d8;
    --muted: rgba(239, 230, 216, 0.6);
    --line: rgba(239, 230, 216, 0.16);
    --gold: #d9b25c;
    --bg: #0d0c0b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .brand { position: fixed; top: 28px; left: 32px; display: flex; align-items: baseline; gap: 14px; pointer-events: none; }
  .brand .kanji { font-family: 'Shippori Mincho', serif; font-size: 20px; color: var(--gold); letter-spacing: 0.12em; }
  .brand .word { font-family: 'Cormorant Garamond', serif; font-size: 26px; letter-spacing: 0.08em; }
  .brand .sub { font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }

  .counter { position: fixed; top: 32px; right: 32px; font-size: 12px; letter-spacing: 0.22em; color: var(--muted);
    font-variant-numeric: tabular-nums; text-align: right; }
  .counter b { color: var(--ink); font-weight: 500; }
  .status { margin-top: 8px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold);
    opacity: 0; transition: opacity 0.4s; }
  .status.on { opacity: 0.9; }

  .hint { position: fixed; left: 50%; top: 34px; transform: translateX(-50%); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--muted); pointer-events: none; white-space: nowrap; }

  .info { position: fixed; left: 32px; bottom: 32px; max-width: 390px; transition: opacity 0.35s ease, transform 0.35s ease; }
  .info.out { opacity: 0; transform: translateY(10px); }
  .tag { display: inline-block; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .tag.ref { color: var(--gold); border-color: rgba(217, 178, 92, 0.45); }
  .info h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 46px; line-height: 1.04; margin: 14px 0 6px; }
  .info .jp { font-family: 'Shippori Mincho', serif; color: var(--gold); font-size: 15px; letter-spacing: 0.2em; }
  .info .meta { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); margin: 16px 0 8px; text-transform: uppercase; }
  .info .desc { font-size: 14px; line-height: 1.6; color: rgba(239, 230, 216, 0.82); margin: 0; font-weight: 300; }

  .nav { position: fixed; right: 32px; bottom: 32px; display: flex; align-items: center; gap: 18px; }
  .arrow { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20, 18, 16, 0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--ink); cursor: pointer; display: grid; place-items: center;
    transition: border-color 0.25s, color 0.25s, opacity 0.25s; padding: 0; }
  .arrow:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .arrow:disabled { opacity: 0.28; cursor: default; }
  .arrow svg { width: 18px; height: 18px; }
  .dots { display: flex; gap: 8px; }
  .dots button { width: 24px; height: 18px; border: 0; padding: 0; background: none; cursor: pointer; position: relative; }
  .dots button::after { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--line);
    transition: background 0.3s; }
  .dots button.on::after { background: var(--gold); }
  .dots button:hover::after { background: rgba(217, 178, 92, 0.6); }

  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity 0.9s ease;
    z-index: 10; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .box { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #loader svg { width: 120px; height: 120px; }
  #loader .crack { stroke: var(--gold); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-dasharray: 200;
    stroke-dashoffset: 200; animation: draw 2.4s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 200; } 55%, 100% { stroke-dashoffset: 0; } }
  #loader p { margin: 0; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }

  body.recording .brand, body.recording .hint, body.recording .counter, body.recording .info, body.recording .nav { display: none; }
  body.recording canvas { inset: auto; }
  #recBadge { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5; display: none; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 999px; background: rgba(20, 18, 16, 0.75); border: 1px solid var(--line);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  #recBadge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #e0483e; }
  body.recording #recBadge, #recBadge.on { display: flex; }

  @media (max-width: 760px) {
    .brand { top: 18px; left: 16px; gap: 10px; }
    .brand .sub, .hint { display: none; }
    .counter { top: 22px; right: 16px; }
    .info { left: 16px; right: 16px; bottom: 96px; max-width: none; }
    .info h1 { font-size: 32px; margin-top: 10px; }
    .info .meta { margin-top: 10px; }
    .info .desc { font-size: 13px; }
    .nav { left: 16px; right: 16px; bottom: 24px; justify-content: space-between; }
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ==== CORE BEGIN ===========================================================
// Procedural pottery: revolved profiles, baked PBR glaze maps, gold seams.

const TAU = Math.PI * 2;
const D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const nextFrame = () => new Promise((r) => (globalThis.requestAnimationFrame || setTimeout)(r));

// ---- noise -----------------------------------------------------------------

function hashi(x, y, z, seed) {
  let h = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x9e3779b1) ^ Math.imul(seed, 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  return (h ^ (h >>> 15)) >>> 0;
}
const hash3 = (x, y, z, s) => hashi(x, y, z, s) / 4294967296;

function noise3(x, y, z, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = hash3(xi, yi, zi, seed), c100 = hash3(xi + 1, yi, zi, seed);
  const c010 = hash3(xi, yi + 1, zi, seed), c110 = hash3(xi + 1, yi + 1, zi, seed);
  const c001 = hash3(xi, yi, zi + 1, seed), c101 = hash3(xi + 1, yi, zi + 1, seed);
  const c011 = hash3(xi, yi + 1, zi + 1, seed), c111 = hash3(xi + 1, yi + 1, zi + 1, seed);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
  const x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}

function fbm3(x, y, z, oct = 4, seed = 0) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) {
    s += a * noise3(x, y, z, seed + i * 17);
    n += a; a *= 0.5; x *= 2.03; y *= 2.03; z *= 2.03;
  }
  return s / n;
}

// Distance-to-cell-edge (F2 - F1) of a 3D Voronoi field: crackle glaze lines.
function cellEdge3(x, y, z, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  let f1 = 9, f2 = 9;
  for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = xi + dx, cy = yi + dy, cz = zi + dz;
    const h = hashi(cx, cy, cz, seed);
    const px = cx + (h & 1023) / 1024 - x, py = cy + ((h >>> 10) & 1023) / 1024 - y, pz = cz + ((h >>> 20) & 1023) / 1024 - z;
    const d = px * px + py * py + pz * pz;
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
  }
  return Math.sqrt(f2) - Math.sqrt(f1);
}

function noise1(x, seed) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return (hash3(i, 0, 0, seed) * (1 - u) + hash3(i + 1, 0, 0, seed) * u) * 2 - 1;
}
function noise1Lin(x, seed) {
  const i = Math.floor(x), f = x - i;
  return (hash3(i, 0, 0, seed) * (1 - f) + hash3(i + 1, 0, 0, seed) * f) * 2 - 1;
}

// Fracture wander: slow drift + small kinks + angular jaggedness.
const jitLow = (l, seed) => 0.02 * noise1(l * 1.3, seed) + 0.007 * noise1(l * 5.5, seed + 1);
const jitHigh = (l, seed) => 0.0026 * noise1(l * 20, seed + 2) + 0.0011 * noise1Lin(l * 62, seed + 3);

const setC = (o, r, g, b) => { o.c[0] = r; o.c[1] = g; o.c[2] = b; };
const blendC = (o, r, g, b, t) => { o.c[0] += (r - o.c[0]) * t; o.c[1] += (g - o.c[1]) * t; o.c[2] += (b - o.c[2]) * t; };

// ---- surface of revolution -------------------------------------------------
// A profile (r, y) runs from the bottom pole, out along the underside, over the lip,
// and back along the inside to the top pole. s ∈ [0,1] is arc length along it.

class Revolved {
  constructor(ctrl, { samples = 480, warp = null, ripple = null, lipBy = 'y' } = {}) {
    const curve = new THREE.CatmullRomCurve3(ctrl.map(([r, y]) => new THREE.Vector3(r, y, 0)), false, 'centripetal');
    const pts = curve.getSpacedPoints(samples);
    const N = (this.N = samples);
    this.length = curve.getLength();
    this.r = new Float32Array(N + 1); this.y = new Float32Array(N + 1);
    this.nr = new Float32Array(N + 1); this.ny = new Float32Array(N + 1);
    for (let i = 0; i <= N; i++) {
      this.r[i] = Math.max(0, pts[i].x);
      this.y[i] = pts[i].y;
      if (ripple) this.r[i] += ripple(this.r[i], this.y[i], i / N);
    }
    this.r[0] = 0; this.r[N] = 0;
    for (let i = 0; i <= N; i++) {
      const a = Math.max(i - 1, 0), b = Math.min(i + 1, N);
      const dr = this.r[b] - this.r[a], dy = this.y[b] - this.y[a];
      const l = Math.hypot(dr, dy) || 1;
      this.nr[i] = dy / l; this.ny[i] = -dr / l;
    }
    this.nr[0] = 0; this.ny[0] = -1; this.nr[N] = 0; this.ny[N] = 1;
    const key = lipBy === 'r' ? this.r : this.y;
    this.iLip = 0;
    for (let i = 1; i <= N; i++) if (key[i] > key[this.iLip]) this.iLip = i;
    this.sLip = this.iLip / N;
    this.rMax = Math.max(...this.r);
    this.warp = warp;
  }

  sample(s, o = {}) {
    const f = clamp(s) * this.N, i = Math.min(Math.floor(f), this.N - 1), t = f - i;
    o.r = mix(this.r[i], this.r[i + 1], t); o.y = mix(this.y[i], this.y[i + 1], t);
    o.nr = mix(this.nr[i], this.nr[i + 1], t); o.ny = mix(this.ny[i], this.ny[i + 1], t);
    o.s = s; o.inner = f > this.iLip;
    return o;
  }

  point(s, th, P, Nm) {
    const o = this.sample(s, this._tmp || (this._tmp = {}));
    let r = o.r, y = o.y;
    if (this.warp) { const w = this.warp(th, r, y); r *= w[0]; y += w[1]; }
    const c = Math.cos(th), si = Math.sin(th);
    P.set(r * c, y, r * si);
    if (Nm) Nm.set(o.nr * c, o.ny, o.nr * si).normalize();
    return P;
  }

  // First s where the profile crosses `value` (on 'r' or 'y'), walking away from the lip.
  sAt(branch, key, value) {
    const arr = key === 'r' ? this.r : this.y, L = this.iLip, N = this.N;
    if (branch === 'inner') {
      for (let i = L; i < N; i++) {
        const a = arr[i] - value, b = arr[i + 1] - value;
        if (a === 0) return i / N;
        if (a * b < 0) return (i + a / (a - b)) / N;
      }
      return 1;
    }
    for (let i = L; i > 0; i--) {
      const a = arr[i] - value, b = arr[i - 1] - value;
      if (a === 0) return i / N;
      if (a * b < 0) return (i - a / (a - b)) / N;
    }
    return 0;
  }

  geometry(segT, uvMode) {
    const N = this.N, cols = segT + 1, count = (N + 1) * cols;
    const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), uv = new Float32Array(count * 2);
    const P = new THREE.Vector3(), Nm = new THREE.Vector3(), R = this.rMax * 1.03;
    for (let i = 0; i <= N; i++) {
      for (let j = 0; j <= segT; j++) {
        const k = i * cols + j;
        this.point(i / N, (j / segT) * TAU, P, Nm);
        P.toArray(pos, k * 3); Nm.toArray(nor, k * 3);
        if (uvMode === 'planar') { uv[k * 2] = P.x / (2 * R) + 0.5; uv[k * 2 + 1] = P.z / (2 * R) + 0.5; }
        else { uv[k * 2] = j / segT; uv[k * 2 + 1] = i / N; }
      }
    }
    const idx = new Uint32Array(N * segT * 6);
    let p = 0;
    for (let i = 0; i < N; i++) for (let j = 0; j < segT; j++) {
      const a = i * cols + j, b = a + cols, c = b + 1, d = a + 1;
      idx[p++] = a; idx[p++] = b; idx[p++] = d;
      idx[p++] = b; idx[p++] = c; idx[p++] = d;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeBoundingSphere();
    return g;
  }
}

// ---- crack paths (in surface parameters s, θ) ------------------------------

const wrapAngle = (a) => a - TAU * Math.round(a / TAU);
const unwrap = (pts) => { for (let i = 1; i < pts.length; i++) pts[i][1] = pts[i - 1][1] + wrapAngle(pts[i][1] - pts[i - 1][1]); return pts; };
const unwarpedPoint = (surf, [s, th], out = new THREE.Vector3(), smp = {}) => {
  surf.sample(s, smp);
  return out.set(smp.r * Math.cos(th), smp.y, smp.r * Math.sin(th));
};

// Resample a dense (s, θ) polyline by true 3D arc length, then roughen it with fracture wander.
function roughen(surf, pts, { closed = false, seed = 1, amp = 0.7, step = 0.004 } = {}) {
  const src = closed ? [...pts, [pts[0][0], pts[pts.length - 1][1] + wrapAngle(pts[0][1] - pts[pts.length - 1][1])]] : pts;
  const P = new THREE.Vector3(), Q = new THREE.Vector3(), acc = [0];
  surf.point(src[0][0], src[0][1], Q);
  for (let i = 1; i < src.length; i++) { surf.point(src[i][0], src[i][1], P); acc.push(acc[i - 1] + P.distanceTo(Q)); Q.copy(P); }
  const total = acc[acc.length - 1], n = Math.max(4, Math.round(total / step)), out = [];
  let k = 0;
  for (let m = 0; m <= (closed ? n - 1 : n); m++) {
    const target = (m / n) * total;
    while (k < src.length - 2 && acc[k + 1] < target) k++;
    const t = clamp((target - acc[k]) / (acc[k + 1] - acc[k] || 1));
    out.push([mix(src[k][0], src[k + 1][0], t), mix(src[k][1], src[k + 1][1], t), target]);
  }
  const L = surf.length, smp = {}, cnt = out.length;
  const res = out.map(([s, th, l], m) => {
    const a = out[closed ? (m - 1 + cnt) % cnt : Math.max(m - 1, 0)], b = out[closed ? (m + 1) % cnt : Math.min(m + 1, cnt - 1)];
    const r = Math.max(surf.sample(s, smp).r, 0.03);
    let tx = (b[0] - a[0]) * L, ty = wrapAngle(b[1] - a[1]) * r;
    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const j = (x) => amp * jitLow(x, seed) + jitHigh(x, seed);
    let d = j(l);
    if (closed) d = mix(d, j(l - total), smoothstep(total - 0.1, total, l));
    else d *= smoothstep(0, 0.03, l) * smoothstep(0, 0.03, total - l);
    return [clamp(s + (-ty * d) / L, 0.0005, 0.9995), th + (tx * d) / r];
  });
  return { pts: res, closed };
}

// ---- fracture planes ----------------------------------------------------------
// Real breaks run roughly perpendicular to the wall and nearly straight through the body,
// so each crack starts as the section of the vessel by a plane, then gets roughened.

// Plane through two surface points that contains the wall normal between them.
function planeThrough(surf, p1, p2) {
  const smp = {}, A = unwarpedPoint(surf, p1), B = unwarpedPoint(surf, p2);
  surf.sample((p1[0] + p2[0]) / 2, smp);
  const tm = p1[1] + wrapAngle(p2[1] - p1[1]) / 2;
  const N = new THREE.Vector3(smp.nr * Math.cos(tm), smp.ny, smp.nr * Math.sin(tm));
  const n = new THREE.Vector3().subVectors(B, A).cross(N).normalize();
  return { n, d: n.dot(A) };
}

// Closed (s, θ) loops where n·P = d on the surface. Each profile circle meets the plane
// at θ = φ ± acos(k); the + and − branches join where |k| = 1.
function planeLoops(surf, { n, d }, steps = 1600) {
  const smp = {}, h = Math.hypot(n.x, n.z), phi = Math.atan2(n.z, n.x);
  const k = (s) => { surf.sample(s, smp); return (d - n.y * smp.y) / Math.max(smp.r * h, 1e-6); };
  const inside = (s) => Math.abs(k(s)) <= 1;
  const edge = (a, b) => { for (let i = 0; i < 32; i++) { const m = (a + b) / 2; if (inside(m)) a = m; else b = m; } return a; };
  const at = (s, sg) => [s, phi + sg * Math.acos(clamp(k(s), -1, 1))];
  const loops = [];
  let plus = null, minus = null, prev = 0;
  const finish = (sEnd) => {
    if (sEnd !== null) plus.push(at(sEnd, 1));
    const pts = [...plus, ...minus.reverse()];
    if (pts.length > 8) loops.push(unwrap(pts));
    plus = null;
  };
  for (let i = 0; i <= steps; i++) {
    const s = i / steps, ins = inside(s);
    if (ins && !plus) { plus = []; minus = []; if (i > 0) plus.push(at(edge(s, prev), 1)); }
    if (ins) { plus.push(at(s, 1)); minus.push(at(s, -1)); }
    else if (plus) finish(edge(prev, s));
    prev = s;
  }
  if (plus) finish(null);
  return loops;
}

// Keep only the parts of each run where test(P) holds (P on the unwarped surface).
function clipRuns(surf, runs, test) {
  const out = [], smp = {}, P = new THREE.Vector3();
  for (const run of runs) {
    let pts = run.pts, ok = pts.map((p) => test(unwarpedPoint(surf, p, P, smp)));
    if (ok.every(Boolean)) { out.push(run); continue; }
    if (run.closed) { const k = ok.indexOf(false); pts = [...pts.slice(k), ...pts.slice(0, k)]; ok = [...ok.slice(k), ...ok.slice(0, k)]; }
    let cur = [];
    for (let i = 0; i <= pts.length; i++) {
      if (i < pts.length && ok[i]) cur.push([...pts[i]]);
      else { if (cur.length > 8) out.push({ pts: unwrap(cur), closed: false }); cur = []; }
    }
  }
  return out;
}

const sideOf = (surf, { n, d }, ref, margin = 0) => {
  const sg = Math.sign(n.dot(unwarpedPoint(surf, ref)) - d);
  return (P) => sg * (n.dot(P) - d) > margin;
};
const above = (y) => (P) => P.y > y;
// Half of the vessel facing direction θ (keeps a crack from wrapping round to the far side).
const facing = (th, off = 0.03) => (P) => P.x * Math.cos(th) + P.z * Math.sin(th) > off;

// A crack along the plane through p1 and p2, clipped by `keep`, taking the run nearest `near`.
function fracture(surf, plane, { keep = [], near, seed = 1, amp = 0.7 }) {
  let runs = planeLoops(surf, plane).map((pts) => ({ pts, closed: true }));
  for (const test of keep) runs = clipRuns(surf, runs, test);
  const P = unwarpedPoint(surf, near), Q = new THREE.Vector3(), smp = {};
  let best = null, bd = Infinity;
  for (const run of runs) for (const p of run.pts) {
    const dd = unwarpedPoint(surf, p, Q, smp).distanceToSquared(P);
    if (dd < bd) { bd = dd; best = run; }
  }
  return roughen(surf, best.pts, { closed: best.closed, seed, amp });
}

// Join the free ends of a branch onto the crack it stops against (a T-junction).
function snapTo(surf, path, target, reach = 0.06) {
  if (path.closed) return path;
  const P = new THREE.Vector3(), Q = new THREE.Vector3();
  path.join = path.join || [false, false];
  for (const end of [0, 1]) {
    const p = end ? path.pts[path.pts.length - 1] : path.pts[0];
    surf.point(p[0], p[1], P);
    let best = null, bd = reach * reach;
    for (const q of target.pts) { const dd = surf.point(q[0], q[1], Q).distanceToSquared(P); if (dd < bd) { bd = dd; best = q; } }
    if (!best) continue;
    const q = [best[0], p[1] + wrapAngle(best[1] - p[1])];
    if (end) path.pts.push(q); else path.pts.unshift(q);
    path.join[end] = true;
  }
  return path;
}

// Through-crack across a plate/bowl seen from above: a chord over the inside,
// over the lip, back along the underside, over the lip again. Returns a closed loop.
function chordCrack(surf, { thA, thB, ctrl, rEnd, seed = 1, amp = 1, step = 0.004 }) {
  const A = new THREE.Vector2(Math.cos(thA), Math.sin(thA)).multiplyScalar(rEnd);
  const B = new THREE.Vector2(Math.cos(thB), Math.sin(thB)).multiplyScalar(rEnd);
  const bez = new THREE.QuadraticBezierCurve(A, new THREE.Vector2(ctrl[0], ctrl[1]), B);
  const len = bez.getLength(), n = Math.max(8, Math.round(len / step));
  const base = bez.getSpacedPoints(n);
  const toS = (x, z, branch) => [surf.sAt(branch, 'r', Math.min(Math.hypot(x, z), rEnd)), Math.atan2(z, x)];
  const top = [], bot = [], plan = [];
  for (let i = 0; i <= n; i++) {
    const l = (i / n) * len, p = base[i], q = base[Math.min(i + 1, n)], q0 = base[Math.max(i - 1, 0)];
    let tx = q.x - q0.x, tz = q.y - q0.y;
    const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl;
    const taper = smoothstep(0, 0.06, l) * smoothstep(0, 0.06, len - l);
    const shared = amp * jitLow(l, seed) * taper;
    const dT = shared + amp * jitHigh(l, seed + 100) * taper;
    const dB = shared + amp * jitHigh(l, seed + 200) * taper;
    plan.push([p.x - tz * dT, p.y + tx * dT]);
    top.push(toS(p.x - tz * dT, p.y + tx * dT, 'inner'));
    bot.push(toS(p.x - tz * dB, p.y + tx * dB, 'outer'));
  }
  const sI = surf.sAt('inner', 'r', rEnd), sO = surf.sAt('outer', 'r', rEnd);
  const m = Math.max(3, Math.ceil(((sI - sO) * surf.length) / step));
  const lipB = [], lipA = [];
  for (let k = 1; k < m; k++) {
    lipB.push([mix(sI, sO, k / m), top[n][1]]);
    lipA.push([mix(sO, sI, k / m), top[0][1]]);
  }
  return { paths: [{ pts: [...top, ...lipB, ...bot.reverse(), ...lipA], closed: true }], plan };
}

// ---- gold seam geometry -----------------------------------------------------
// A raised, slightly flattened lacquer bead swept along the crack on the surface.

function buildBead(surf, paths, { width, height, seed = 3, ao = null }) {
  const RAD = 12;
  const pos = [], uvs = [], cols = [], idx = [];
  const P = new THREE.Vector3(), Nm = new THREE.Vector3(), T = new THREE.Vector3(), B = new THREE.Vector3(), V = new THREE.Vector3();
  const smp = {};
  for (const path of paths) {
    const pts = path.pts, n = pts.length, closed = path.closed;
    const Ps = [], Ns = [];
    for (const [s, th] of pts) {
      const n3 = new THREE.Vector3();
      Ps.push(surf.point(s, th, new THREE.Vector3(), n3));
      Ns.push(n3);
    }
    const acc = [0];
    for (let i = 1; i < n; i++) acc.push(acc[i - 1] + Ps[i].distanceTo(Ps[i - 1]));
    const total = acc[n - 1];
    const base = pos.length / 3;
    for (let i = 0; i < n; i++) {
      const a = closed ? (i - 1 + n) % n : Math.max(i - 1, 0), b = closed ? (i + 1) % n : Math.min(i + 1, n - 1);
      T.subVectors(Ps[b], Ps[a]).normalize();
      Nm.copy(Ns[i]).addScaledVector(T, -Ns[i].dot(T)).normalize();
      B.crossVectors(T, Nm).normalize();
      Nm.crossVectors(B, T);
      const l = acc[i];
      const join = path.join || [false, false];
      const taper = closed ? 1 : Math.sqrt((join[0] ? 1 : smoothstep(0, 0.04, l)) * (join[1] ? 1 : smoothstep(0, 0.04, total - l)));
      const w = width * (0.8 + 0.22 * noise1(l * 9, seed) + 0.1 * noise1Lin(l * 45, seed + 1)) * taper;
      const h = height * (0.85 + 0.2 * noise1(l * 13, seed + 2)) * taper;
      const shade = ao ? mix(0.55, 1, clamp(ao(surf.sample(pts[i][0], smp)))) : 1;
      for (let k = 0; k <= RAD; k++) {
        const ang = (k / RAD) * TAU, ca = Math.cos(ang), sa = Math.sin(ang);
        const up = sa > 0 ? Math.pow(sa, 0.65) * h : sa * h * 1.2;
        V.copy(Ps[i]).addScaledVector(B, ca * w).addScaledVector(Nm, up - h * 0.25);
        pos.push(V.x, V.y, V.z);
        uvs.push(l / 0.3, k / RAD);
        cols.push(shade, shade, shade);
      }
    }
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const i1 = (i + 1) % n;
      for (let k = 0; k < RAD; k++) {
        const a = base + i * (RAD + 1) + k, b = base + i1 * (RAD + 1) + k, c = b + 1, d = a + 1;
        idx.push(a, b, d, b, c, d);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// ---- texture baking -----------------------------------------------------------
// Each piece supplies shade(P, o): P = point on the unwarped surface, o = material sample.
// Output is packed glTF-style: color (sRGB), ORM (ao, roughness, metalness), clearcoat, normal.

async function bakeMaps(piece, { budget = 10, onProgress } = {}) {
  const { w, h, uv, normalStrength = 3 } = piece.tex;
  const surf = piece.surf, cyl = uv === 'cyl';
  const color = new Uint8ClampedArray(w * h * 4), orm = new Uint8ClampedArray(w * h * 4);
  const coat = new Uint8ClampedArray(w * h * 4), nrm = new Uint8ClampedArray(w * h * 4);
  const height = new Float32Array(w * h);
  const o = { c: [0, 0, 0], rough: 0.5, metal: 0, ao: 1, coat: 1, height: 0 };
  const P = { x: 0, y: 0, z: 0, r: 0, th: 0, s: 0, inner: false };
  const smp = {}, R = surf.rMax * 1.03;
  let deadline = performance.now() + budget;
  const yieldMaybe = async (f) => {
    if (performance.now() > deadline) { onProgress?.(f); await nextFrame(); deadline = performance.now() + budget; }
  };
  for (let j = 0; j < h; j++) {
    const v = (j + 0.5) / h;
    if (cyl) { surf.sample(v, smp); P.s = v; P.inner = smp.inner; P.r = smp.r; P.y = smp.y; }
    for (let i = 0; i < w; i++) {
      const u = (i + 0.5) / w;
      if (cyl) { P.th = u * TAU; P.x = P.r * Math.cos(P.th); P.z = P.r * Math.sin(P.th); }
      else { P.x = (u - 0.5) * 2 * R; P.z = (v - 0.5) * 2 * R; P.r = Math.hypot(P.x, P.z); P.th = Math.atan2(P.z, P.x); }
      o.rough = 0.5; o.metal = 0; o.coat = 1; o.height = 0;
      o.ao = piece.ao ? piece.ao(P) : 1;
      piece.shade(P, o);
      const k = (j * w + i) * 4;
      color[k] = o.c[0] * 255; color[k + 1] = o.c[1] * 255; color[k + 2] = o.c[2] * 255; color[k + 3] = 255;
      orm[k] = o.ao * 255; orm[k + 1] = o.rough * 255; orm[k + 2] = o.metal * 255; orm[k + 3] = 255;
      coat[k] = coat[k + 1] = coat[k + 2] = o.coat * 255; coat[k + 3] = 255;
      height[j * w + i] = o.height;
    }
    await yieldMaybe((j / h) * 0.85);
  }
  for (let j = 0; j < h; j++) {
    const ju = Math.max(j - 1, 0) * w, jd = Math.min(j + 1, h - 1) * w, jr = j * w;
    for (let i = 0; i < w; i++) {
      const il = cyl ? (i - 1 + w) % w : Math.max(i - 1, 0), ir = cyl ? (i + 1) % w : Math.min(i + 1, w - 1);
      const dx = (height[jr + ir] - height[jr + il]) * normalStrength;
      const dy = (height[jd + i] - height[ju + i]) * normalStrength;
      const inv = 1 / Math.sqrt(dx * dx + dy * dy + 1), k = (jr + i) * 4;
      nrm[k] = (-dx * inv * 0.5 + 0.5) * 255; nrm[k + 1] = (-dy * inv * 0.5 + 0.5) * 255;
      nrm[k + 2] = (inv * 0.5 + 0.5) * 255; nrm[k + 3] = 255;
    }
    await yieldMaybe(0.85 + (j / h) * 0.15);
  }
  onProgress?.(1);
  return { color, orm, coat, nrm, w, h };
}

// Burnished gold powder over urushi: fine granular roughness, lacquer showing at the bead edges.
function bakeGold() {
  const w = 512, h = 64;
  const color = new Uint8ClampedArray(w * h * 4), orm = new Uint8ClampedArray(w * h * 4), nrm = new Uint8ClampedArray(w * h * 4);
  const height = new Float32Array(w * h);
  for (let j = 0; j < h; j++) {
    const v = (j + 0.5) / h;
    const side = v < 0.5 ? 1 - smoothstep(0.02, 0.11, Math.min(v, 0.5 - v)) : 1;
    for (let i = 0; i < w; i++) {
      const a = ((i + 0.5) / w) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      const g = fbm3(ca * 16, v * 34, sa * 16, 3, 81);
      const gl = fbm3(ca * 2.2, v * 3, sa * 2.2, 2, 83);
      const k = (j * w + i) * 4;
      const br = 0.92 + 0.16 * (gl - 0.5) + 0.08 * (g - 0.5);
      color[k] = mix(br, 0.66, side * 0.25) * 255;
      color[k + 1] = mix(br, 0.4, side * 0.25) * 255;
      color[k + 2] = mix(br, 0.26, side * 0.25) * 255;
      color[k + 3] = 255;
      orm[k] = 255; orm[k + 1] = clamp(0.15 + 0.16 * g + 0.12 * side + 0.06 * gl) * 255; orm[k + 2] = 255; orm[k + 3] = 255;
      height[j * w + i] = g;
    }
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const dx = (height[j * w + ((i + 1) % w)] - height[j * w + ((i - 1 + w) % w)]) * 5;
    const dy = (height[Math.min(j + 1, h - 1) * w + i] - height[Math.max(j - 1, 0) * w + i]) * 5;
    const inv = 1 / Math.sqrt(dx * dx + dy * dy + 1), k = (j * w + i) * 4;
    nrm[k] = (-dx * inv * 0.5 + 0.5) * 255; nrm[k + 1] = (-dy * inv * 0.5 + 0.5) * 255; nrm[k + 2] = (inv * 0.5 + 0.5) * 255; nrm[k + 3] = 255;
  }
  return { color, orm, nrm, w, h };
}

// ---- renderer, scene, camera ------------------------------------------------

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = makeBackdrop();
scene.environment = studioEnvironment();

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);

const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {
  enableDamping: true, dampingFactor: 0.07, enablePan: false, rotateSpeed: 0.6, zoomSpeed: 0.8,
  minDistance: 1.4, maxDistance: 10, minPolarAngle: 0.15, maxPolarAngle: 1.53,
});

const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.45, 1.0);

composer.addPass(new OutputPass());

// Warm charcoal backdrop with a soft pool of light behind the piece. Dithered against banding.
function makeBackdrop() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(512, 430, 40, 512, 512, 760);
  grd.addColorStop(0, '#3d3833');
  grd.addColorStop(0.45, '#221f1c');
  grd.addColorStop(1, '#0a0909');
  g.fillStyle = grd;
  g.fillRect(0, 0, 1024, 1024);
  const img = g.getImageData(0, 0, 1024, 1024), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 3; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Photo-studio light probe: dim room, large softboxes, strip lights, and a hot spot for gold glints.
function studioEnvironment() {
  const env = new THREE.Scene();
  const room = new THREE.SphereGeometry(30, 64, 32);
  const colors = [], p = room.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = p.getY(i) / 30;
    const v = t > 0 ? mix(0.07, 0.11, t) : mix(0.07, 0.03, -t);
    colors.push(v * 1.05, v, v * 0.92);
  }
  room.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  env.add(new THREE.Mesh(room, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
  const panel = (w, h, intensity, hex, x, y, z) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(x, y, z);
    m.lookAt(0, 0.6, 0);
    env.add(m);
  };
  panel(5, 3.5, 5.5, 0xfff2e2, -4.5, 5, 4.5);   // key softbox
  panel(1.2, 7, 2.6, 0xe6eeff, 7, 2, -1);         // cool strip, right
  panel(1.2, 7, 1.8, 0xfff4ea, -7, 2, -2.5);      // warm strip, left
  panel(9, 1.3, 4.0, 0xffffff, 0, 4.5, -8);       // rim light behind
  panel(6, 4, 2.4, 0xfff6ec, 2, 3, -7);            // back softbox
  panel(5, 3, 1.6, 0xeef2ff, -4, 1.5, -6);         // back fill, low left
  panel(4, 4, 2.2, 0xffffff, 0, 9, 0);            // overhead
  panel(0.7, 0.7, 14, 0xfff0d6, 3.5, 3.2, 5.5);   // small hot spot
  panel(0.5, 2.4, 12, 0xffffff, -3, 2.2, 6);      // thin vertical glint
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(env, 0.02).texture;
  pmrem.dispose();
  return tex;
}

// ---- materials ----------------------------------------------------------------------

function dataTexture(arr, w, h, srgb, wrapS = THREE.ClampToEdgeWrapping) {
  const t = new THREE.DataTexture(new Uint8Array(arr.buffer), w, h, THREE.RGBAFormat);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = wrapS;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = MAX_ANISO;
  t.needsUpdate = true;
  return t;
}

const goldMaps = bakeGold();
const goldMaterial = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color().setRGB(1.0, 0.74, 0.32),   // linear F0 of gold, nudged warm
  metalness: 1,
  roughness: 1,
  map: dataTexture(goldMaps.color, goldMaps.w, goldMaps.h, true, THREE.RepeatWrapping),
  roughnessMap: dataTexture(goldMaps.orm, goldMaps.w, goldMaps.h, false, THREE.RepeatWrapping),
  normalMap: dataTexture(goldMaps.nrm, goldMaps.w, goldMaps.h, false, THREE.RepeatWrapping),
  normalScale: new THREE.Vector2(0.3, 0.3),
  vertexColors: true,
  envMapIntensity: 1.45,
});

const firingMaterial = new THREE.MeshPhysicalMaterial({ color: 0x2a2622, roughness: 0.55, clearcoat: 0.3, clearcoatRoughness: 0.3 });

const acrylic = new THREE.MeshPhysicalMaterial({
  color: 0xdfe6e4, metalness: 0, roughness: 0.04, transparent: true, opacity: 0.16, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6,
});

function potteryMaterial(piece, maps) {
  const wrap = piece.tex.uv === 'cyl' ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  const orm = dataTexture(maps.orm, maps.w, maps.h, false, wrap);
  return new THREE.MeshPhysicalMaterial({
    map: dataTexture(maps.color, maps.w, maps.h, true, wrap),
    aoMap: orm, roughnessMap: orm, metalnessMap: orm,
    roughness: 1, metalness: 1,
    normalMap: dataTexture(maps.nrm, maps.w, maps.h, false, wrap),
    normalScale: new THREE.Vector2(piece.normalScale, piece.normalScale),
    clearcoat: piece.coat.clearcoat,
    clearcoatRoughness: piece.coat.roughness,
    clearcoatMap: dataTexture(maps.coat, maps.w, maps.h, false, wrap),
    specularIntensity: 1,
    ior: 1.52,
  });
}

// ---- build the carousel -----------------------------------------------------------

const SPACING = 3.9;
const box = new THREE.Box3(), tmp = new THREE.Vector3();

const pieces = PIECES.map((def, i) => {
  const p = Object.assign({}, def, def.build());
  p.index = i;
  p.root = new THREE.Group();
  p.spin = new THREE.Group();
  p.holder = new THREE.Group();
  p.root.position.x = i * SPACING;
  p.root.add(p.spin);
  p.spin.add(p.holder);
  scene.add(p.root);

  p.mesh = new THREE.Mesh(p.surf.geometry(p.segT || 256, p.tex.uv), firingMaterial);
  p.mesh.castShadow = p.mesh.receiveShadow = true;
  p.mesh.userData.index = i;
  p.goldMesh = new THREE.Mesh(buildBead(p.surf, p.cracks, { ...p.gold, ao: p.ao }), goldMaterial);
  p.goldMesh.castShadow = true;
  p.holder.add(p.mesh, p.goldMesh);

  if (p.mount === 'stand') mountOnStand(p);
  else p.holder.scale.setScalar(p.scale || 1);

  p.root.updateMatrixWorld(true);
  box.setFromObject(p.holder);
  p.focusY = (box.min.y + box.max.y) / 2;
  const size = box.getSize(tmp);
  const decal = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false, color: 0x000000 }));
  decal.rotation.x = -Math.PI / 2;
  decal.position.set((box.min.x + box.max.x) / 2 - p.root.position.x, 0.002, (box.min.z + box.max.z) / 2);
  decal.scale.set(size.x * 1.25, Math.max(size.z, 0.5) * 1.25, 1);
  p.spin.add(decal);

  p.ready = false;
  return p;
});

// The reference plate stands upright on a small acrylic easel, as photographed.
function mountOnStand(p) {
  const a = Math.PI / 2 - 0.22;   // lean back 0.22 rad from vertical
  p.holder.rotation.x = a;
  p.holder.updateMatrixWorld(true);
  box.setFromObject(p.holder);
  const BASE = 0.01;               // acrylic base thickness; the rim rests on it
  p.holder.position.y = -box.min.y + BASE;
  p.holder.updateMatrix();
  const lift = p.holder.position.y, ca = Math.cos(a), sa = Math.sin(a);
  const toSpin = (x, y, z) => new THREE.Vector3(x, y, z).applyMatrix4(p.holder.matrix);

  // Front tabs: built in plate space, parallel to the face, clearing the glaze and lip,
  // running down past the rim until they meet the base.
  const pos = p.mesh.geometry.attributes.position, z0 = 0.84;
  let frontZ = -Infinity;
  for (const sx of [-1, 1]) {
    const cx = sx * 0.32;
    let top = -Infinity;
    for (let i = 0; i < pos.count; i++) {
      if (Math.abs(pos.getX(i) - cx) < 0.06 && pos.getZ(i) > z0 - 0.03) top = Math.max(top, pos.getY(i));
    }
    const yc = top + 0.012;
    const zEnd = (lift + yc * ca - BASE - 0.004) / sa;
    const tab = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.01, zEnd - z0), acrylic);
    tab.position.set(cx, yc, (z0 + zEnd) / 2);
    p.holder.add(tab);
    frontZ = Math.max(frontZ, toSpin(cx, yc, zEnd).z);
  }

  // Back support, parallel to the plate, just behind its foot ring.
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.012, 0.86), acrylic);
  back.position.set(0, -0.012, 0.5);
  p.holder.add(back);

  const zFront = frontZ + 0.05, zBack = zFront - 0.6;
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.9, BASE, zFront - zBack), acrylic);
  base.position.set(0, BASE / 2, (zFront + zBack) / 2);
  p.spin.add(base);
}

// ---- texture baking queue (nearest piece first) -------------------------------------

let current = 0;
let rec = null;   // active video capture, see the CCapture section at the end
const statusEl = document.getElementById('status');
const loader = document.getElementById('loader');

(async function bakeAll() {
  const queue = [...pieces];
  while (queue.length) {
    queue.sort((a, b) => Math.abs(a.index - current) - Math.abs(b.index - current));
    const p = queue.shift();
    const maps = await bakeMaps(p, { onProgress: (f) => { p.progress = f; updateStatus(); } });
    p.mesh.material = potteryMaterial(p, maps);
    p.ready = true;
    p.pop = 0;
    updateStatus();
    if (!loader.classList.contains('done') && pieces[current].ready) loader.classList.add('done');
  }
})();

function updateStatus() {
  const p = pieces[current];
  statusEl.classList.toggle('on', !p.ready);
  if (!p.ready) statusEl.textContent = `Firing glaze ${Math.round((p.progress || 0) * 100)}%`;
  if (!loader.classList.contains('done')) {
    document.getElementById('loadText').textContent = `Mixing urushi & gold · ${Math.round((p.progress || 0) * 100)}%`;
  }
}

// ---- UI ------------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const dotsEl = $('dots');
$('total').textContent = String(pieces.length).padStart(2, '0');
pieces.forEach((p, i) => {
  const b = document.createElement('button');
  b.setAttribute('aria-label', p.name);
  b.addEventListener('click', () => go(i));
  dotsEl.appendChild(b);
});

function renderInfo() {
  const p = pieces[current];
  $('idx').textContent = String(current + 1).padStart(2, '0');
  $('tag').textContent = p.tag;
  $('tag').classList.toggle('ref', p.tag === 'Reference');
  $('name').textContent = p.name;
  $('jp').textContent = p.jp;
  $('meta').textContent = p.meta;
  $('desc').textContent = p.desc;
  [...dotsEl.children].forEach((b, i) => b.classList.toggle('on', i === current));
  $('prev').disabled = current === 0;
  $('next').disabled = current === pieces.length - 1;
  updateStatus();
}

let infoTimer;
function go(i) {
  i = clamp(i, 0, pieces.length - 1);
  if (i === current) return;
  current = i;
  const info = $('info');
  info.classList.add('out');
  clearTimeout(infoTimer);
  infoTimer = setTimeout(() => { renderInfo(); info.classList.remove('out'); }, 260);
  [...dotsEl.children].forEach((b, k) => b.classList.toggle('on', k === current));
  $('prev').disabled = current === 0;
  $('next').disabled = current === pieces.length - 1;
  startViewTween(pieces[i].view);
}

$('prev').addEventListener('click', () => go(current - 1));
$('next').addEventListener('click', () => go(current + 1));
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(current + 1);
  if (e.key === 'ArrowLeft') go(current - 1);
});

// Horizontal trackpad swipe browses; vertical scroll stays zoom.
let swipeAcc = 0, swipeLock = 0;
canvas.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  const now = performance.now();
  if (now < swipeLock) return;
  swipeAcc += e.deltaX;
  if (Math.abs(swipeAcc) > 60) { go(current + Math.sign(swipeAcc)); swipeAcc = 0; swipeLock = now + 700; }
}, { passive: true });

// Click a neighbouring piece to bring it forward.
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = pieces.map((p) => p.mesh);
let downAt = null;
const pick = (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.index : -1;
};
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const i = pick(e);
  if (i >= 0 && i !== current) go(i);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.buttons) return;
  const i = pick(e);
  canvas.style.cursor = i >= 0 && i !== current ? 'pointer' : 'grab';
});

// ---- camera choreography ---------------------------------------------------------

const focus = new THREE.Vector3(0, pieces[0].focusY, 0);
controls.target.copy(focus);
camera.position.copy(focus).add(new THREE.Vector3().setFromSphericalCoords(pieces[0].view.r, pieces[0].view.phi, 0));

let viewTween = null, lastInteract = -10;
const sph = new THREE.Spherical();
function startViewTween(view) {
  sph.setFromVector3(tmp.subVectors(camera.position, controls.target));
  let theta = sph.theta;
  while (theta > Math.PI) theta -= TAU;
  while (theta < -Math.PI) theta += TAU;
  viewTween = { t: 0, from: { r: sph.radius, phi: sph.phi, theta }, to: { r: view.r, phi: view.phi, theta: 0 } };
}
controls.addEventListener('start', () => { viewTween = null; lastInteract = clock.elapsedTime; });
controls.addEventListener('end', () => { lastInteract = clock.elapsedTime; });

function resize() {
  if (rec) { fitRecordingCanvas(); return; }
  const w = innerWidth, h = innerHeight, aspect = w / h;
  camera.aspect = aspect;
  camera.fov = clamp((2 * Math.atan(Math.tan(26 * D2R) / aspect)) / D2R, 28, 62);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setPixelRatio(DPR);
  composer.setSize(w, h);
}
addEventListener('resize', resize);
resize();
renderInfo();

// ---- loop -------------------------------------------------------------------------------

const clock = new THREE.Clock();
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

renderer.setAnimationLoop(() => {
  const realDt = Math.min(clock.getDelta(), 0.05);
  const dt = rec ? 1 / rec.fps : realDt, time = clock.elapsedTime;
  if (rec) recordingStep();

  // Glide the focus along the row; the camera rides along, keeping its orbit.
  const k = 1 - Math.exp(-dt * 4.2);
  const target = pieces[current];
  const nx = mix(focus.x, current * SPACING, k), ny = mix(focus.y, target.focusY, k);
  tmp.set(nx - focus.x, ny - focus.y, 0);
  focus.set(nx, ny, 0);
  controls.target.add(tmp);
  camera.position.add(tmp);

  if (viewTween) {
    viewTween.t = Math.min(1, viewTween.t + dt / 1.3);
    const e = ease(viewTween.t), f = viewTween.from, to = viewTween.to;
    sph.set(mix(f.r, to.r, e), mix(f.phi, to.phi, e), mix(f.theta, to.theta, e));
    camera.position.copy(controls.target).add(tmp.setFromSpherical(sph));
    if (viewTween.t >= 1) viewTween = null;
  }
  controls.update();

  const idle = time - lastInteract > 3.5;
  for (const p of pieces) {
    const d = Math.abs(focus.x - p.index * SPACING) / SPACING;
    const near = 1 - clamp(d);
    const active = p.index === current;
    if (p.motion === 'sway') {
      if (!active || idle) p.swayT = (p.swayT || 0) + dt;
      p.spin.rotation.y = 0.42 * Math.sin((p.swayT || 0) * 0.32);
    } else if (!active || idle) {
      p.spin.rotation.y += dt * 0.16;
    }
    let s = 0.84 + 0.16 * near;
    if (p.pop !== undefined && p.pop < 1) { p.pop = Math.min(1, p.pop + dt * 1.6); s *= 0.94 + 0.06 * ease(p.pop); }
    p.root.scale.setScalar(s);
  }

  sun.position.set(focus.x - 2.6, 6.2, 3.8);
  sun.target.position.set(focus.x, 0.4, 0);
  backFill.position.set(focus.x + 2.5, 4, -5);
  backFill.target.position.set(focus.x, 0.6, 0);

  composer.render(dt);
  if (rec) recordingCapture();
});

// ---- social video capture (CCapture.js) ----------------------------------------------
// Press R (or open with ?record) to film a scripted tour of the carousel. CCapture takes over
// the clock, so every frame is rendered at a fixed timestep regardless of how slow it is.
// Options: ?record&size=1080x1920&fps=60&hold=3.2&format=webm   (format: webm | png | jpg)

const recParams = new URLSearchParams(location.search);
const recBadge = $('recBadge');

function loadCCapture() {
  if (window.CCapture) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/ccapture.js@1.1.0/build/CCapture.all.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load CCapture.js'));
    document.head.appendChild(s);
  });
}

function fitRecordingCanvas() {
  const k = Math.min(innerWidth / rec.W, (innerHeight - 64) / rec.H, 1);
  Object.assign(canvas.style, {
    width: `${rec.W * k}px`, height: `${rec.H * k}px`,
    left: `${(innerWidth - rec.W * k) / 2}px`, top: `${(innerHeight - rec.H * k) / 2 + 24}px`,
  });
}

function jumpTo(i) {
  current = i;
  renderInfo();
  focus.set(i * SPACING, pieces[i].focusY, 0);
  controls.target.copy(focus);
  camera.position.copy(focus).add(tmp.setFromSphericalCoords(pieces[i].view.r, pieces[i].view.phi, 0));
  viewTween = null;
}

async function startRecording() {
  if (rec) return;
  const [W, H] = (recParams.get('size') || '1080x1920').split('x').map(Number);
  const fps = Number(recParams.get('fps') || 60);
  const hold = Number(recParams.get('hold') || 3.2);
  const format = recParams.get('format') || 'webm';
  recBadge.classList.add('on');
  recBadge.textContent = 'Preparing recording';
  try { await loadCCapture(); } catch (e) { recBadge.textContent = e.message; return; }
  while (!pieces.every((p) => p.ready)) {
    recBadge.textContent = 'Waiting for glazes';
    await nextFrame();
  }
  await document.fonts.ready;

  const overlay = document.createElement('canvas');
  overlay.width = W; overlay.height = H;
  rec = {
    W, H, fps, hold, frame: 0,
    total: Math.round(hold * pieces.length * fps),
    overlay, ctx: overlay.getContext('2d'),
    capturer: new CCapture({ format, framerate: fps, quality: 95, name: `kintsugi-${W}x${H}-${fps}fps` }),
  };
  document.body.classList.add('recording');
  controls.enabled = false;
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  composer.setPixelRatio(1);
  composer.setSize(W, H);
  camera.aspect = W / H;
  camera.fov = W < H ? 50 : 30;   // portrait: frame the widest bowls edge to edge
  camera.updateProjectionMatrix();
  fitRecordingCanvas();
  jumpTo(0);
  rec.capturer.start();
}

function recordingStep() {
  const i = Math.min(Math.floor(rec.frame / rec.fps / rec.hold), pieces.length - 1);
  if (i !== current) go(i);
}

// Composite the render with a caption so the clip stands on its own in a feed.
function drawCaption(ctx, W, H, t) {
  const u = Math.min(W, H) / 1080, pad = 72 * u;
  const i = Math.min(Math.floor(t / rec.hold), pieces.length - 1), p = pieces[i], local = t - i * rec.hold;
  const last = i === pieces.length - 1;
  const alpha = smoothstep(0.55, 1.0, local) * (last ? 1 : 1 - smoothstep(rec.hold - 0.45, rec.hold - 0.1, local));

  const g = ctx.createLinearGradient(0, H * 0.62, 0, H);
  g.addColorStop(0, 'rgba(8,7,6,0)');
  g.addColorStop(1, 'rgba(8,7,6,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = `${4 * u}px`;
  ctx.fillStyle = '#d9b25c';
  ctx.font = `500 ${34 * u}px "Shippori Mincho", serif`;
  ctx.fillText('金継ぎ', pad, pad + 34 * u);
  const kw = ctx.measureText('金継ぎ').width;
  ctx.fillStyle = '#efe6d8';
  ctx.font = `400 ${42 * u}px "Cormorant Garamond", serif`;
  ctx.fillText('Kintsugi', pad + kw + 18 * u, pad + 34 * u);
  ctx.textAlign = 'right';
  ctx.font = `400 ${24 * u}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(239,230,216,0.65)';
  ctx.fillText(`${String(i + 1).padStart(2, '0')} / ${String(pieces.length).padStart(2, '0')}`, W - pad, pad + 30 * u);
  ctx.textAlign = 'left';

  ctx.globalAlpha = alpha;
  const rise = (1 - alpha) * 14 * u;
  let y = H - pad - 10 * u + rise;
  ctx.font = `400 ${24 * u}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(239,230,216,0.68)';
  ctx.letterSpacing = `${3 * u}px`;
  ctx.fillText(p.meta.toUpperCase(), pad, y);
  y -= 50 * u;
  ctx.fillStyle = '#d9b25c';
  ctx.font = `500 ${34 * u}px "Shippori Mincho", serif`;
  ctx.letterSpacing = `${7 * u}px`;
  ctx.fillText(p.jp, pad, y);
  y -= 58 * u;
  ctx.fillStyle = '#efe6d8';
  ctx.font = `500 ${96 * u}px "Cormorant Garamond", serif`;
  ctx.letterSpacing = '0px';
  ctx.fillText(p.name, pad, y);
  ctx.globalAlpha = 1;
  ctx.letterSpacing = '0px';
}

function recordingCapture() {
  const { ctx, W, H } = rec;
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  drawCaption(ctx, W, H, rec.frame / rec.fps);
  rec.capturer.capture(rec.overlay);
  rec.frame++;
  recBadge.textContent = `Recording ${rec.frame} / ${rec.total}`;
  if (rec.frame >= rec.total) finishRecording();
}

function finishRecording() {
  const { capturer } = rec;
  capturer.stop();
  recBadge.textContent = 'Encoding — the file will download';
  capturer.save();
  rec = null;
  document.body.classList.remove('recording');
  canvas.removeAttribute('style');
  controls.enabled = true;
  renderer.setPixelRatio(DPR);
  resize();
  setTimeout(() => recBadge.classList.remove('on'), 4000);
}

addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') startRecording(); });
if (recParams.has('record')) startRecording();
</script>
</body>
</html>
